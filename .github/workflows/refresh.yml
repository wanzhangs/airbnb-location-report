name: Refresh data

# 에어비앤비 검색 결과·숙소 상세를 새로 수집해 data/와 report.html을 커밋한다.
# 매주 월요일 03:00(한국 시간)에 자동 실행되고, Actions 탭에서 수동으로도 실행할 수 있다. LLM API나 별도 키는 쓰지 않는다.
#
# 임차 비용에는 Update rents 워크플로가 받아 둔 월세 스냅샷(data/rents/)을 쓴다(이 워크플로는 국토부에 접속하지 않는다).
# 에어비앤비 수집량이 비정상적으로 적으면(차단·접속 실패) 새 러너에서 다시 시도한다(최대 3번).
# 3번 모두 안 되면 실패로 끝나고 기존 리포트는 그대로 남는다. 끝나면 Build and publish report가 Pages에 배포한다.
on:
  workflow_dispatch:
    inputs:
      add:
        description: '추가할 시군구 (예: 부산광역시 기장군). 비우면 기존 지역만 수집'
        required: false
        default: ''
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 (한국 시간, UTC 기준 일요일)

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  try1:
    uses: ./.github/workflows/refresh-once.yml
    with:
      add: ${{ inputs.add }}
  try2:
    needs: try1
    if: ${{ !cancelled() && needs.try1.outputs.ok != 'true' }}
    uses: ./.github/workflows/refresh-once.yml
    with:
      add: ${{ inputs.add }}
  try3:
    needs: [try1, try2]
    if: ${{ !cancelled() && needs.try1.outputs.ok != 'true' && needs.try2.outputs.ok != 'true' }}
    uses: ./.github/workflows/refresh-once.yml
    with:
      add: ${{ inputs.add }}
  result:
    needs: [try1, try2, try3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        env:
          OK1: ${{ needs.try1.outputs.ok }}
          OK2: ${{ needs.try2.outputs.ok }}
          OK3: ${{ needs.try3.outputs.ok }}
        run: |
          if [ "$OK1" = "true" ] || [ "$OK2" = "true" ] || [ "$OK3" = "true" ]; then
            echo "갱신 완료 (시도별 결과: 1차 ${OK1:-건너뜀} / 2차 ${OK2:-건너뜀} / 3차 ${OK3:-건너뜀})" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::세 번 모두 갱신하지 못했습니다. 기존 리포트는 그대로입니다. PC에서 python collect.py --refresh, python collect_details.py, python build_report.py 를 실행해 푸시하세요."
            exit 1
          fi
