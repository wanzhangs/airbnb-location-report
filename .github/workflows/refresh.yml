name: Refresh data

# 에어비앤비 검색 결과·국토부 전월세·숙소 상세를 새로 수집해 data/와 report.html을 커밋한다.
# 매주 월요일 03:00(한국 시간)에 자동 실행되고, Actions 탭에서 수동으로도 실행할 수 있다. LLM API나 별도 키는 쓰지 않는다.
# 주의: GitHub 러너(해외 IP)에서 국내 사이트와 에어비앤비가 응답하지 않을 수 있다. 그 경우 PC에서 실행해 푸시한다.
on:
  workflow_dispatch:
    inputs:
      add:
        description: '추가할 시군구 (예: 부산광역시 기장군). 비우면 기존 지역만 수집'
        required: false
        default: ''
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 (한국 시간, UTC 기준 일요일)

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 검색 결과·월세 수집
        env:
          ADD: ${{ inputs.add }}
        run: |
          if [ -n "$ADD" ]; then python collect.py --add "$ADD"; else python collect.py; fi
      - name: 수집 결과 검사
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("data/results.json", encoding="utf-8"))
          n = sum(len(a["listings"]) for a in d["areas"])
          r = sum(len(a["rents"]) for a in d["areas"])
          print(f"지역 {len(d['areas'])}곳 · 숙소 {n}곳 · 월세 계약 {r}건")
          assert len(d["areas"]) >= 5 and n >= 300 and r >= 1000, "수집량이 비정상적으로 적어 커밋하지 않습니다"
          EOF
      - name: 숙소 상세 수집
        run: python collect_details.py
      - name: 리포트 생성
        run: python build_report.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/details.json report.html areas_extra.json 2>/dev/null || git add data/results.json data/details.json report.html
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)" && git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.html
