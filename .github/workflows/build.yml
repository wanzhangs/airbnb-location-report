name: Build report

# 코드나 데이터가 바뀌면 report.html을 다시 만들어 검사하고, 결과물을 Actions 아티팩트로 올린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 문법 검사
        run: python -m py_compile collect.py collect_details.py build_report.py
      - name: 리포트 생성
        run: python build_report.py
      - name: 결과 검사
        run: |
          if grep -q '/\*__DATA__\*/null' report.html; then echo "데이터가 리포트에 들어가지 않았습니다"; exit 1; fi
          test "$(wc -c < report.html)" -gt 500000
          python - <<'EOF'
          import json
          d = json.load(open("data/results.json", encoding="utf-8"))
          n = sum(len(a["listings"]) for a in d["areas"])
          print(f"지역 {len(d['areas'])}곳 · 숙소 {n}곳")
          assert len(d["areas"]) >= 5 and n >= 300, "데이터가 비정상적으로 적습니다"
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.html
